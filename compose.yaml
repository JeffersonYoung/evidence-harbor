name: research-workspace
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Set RESEARCH_DB_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/001-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: postgres
      SKIP_DB_CREATE: 'true'
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    ports: [127.0.0.1:7233:7233]
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: &backend-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: research
      DB_USER: research
      DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Set RESEARCH_DB_PASSWORD}
      API_TOKEN: ${API_TOKEN:-}
      API_TOKENS_JSON: ${API_TOKENS_JSON:-}
      WORKSPACE_ID: default
      LOCAL_WORKER: 'false'
      OBJECTS_DIR: /data/objects
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: research-workspace
      ENABLE_EXTERNAL_PROVIDERS: ${ENABLE_EXTERNAL_PROVIDERS:-false}
      EXTERNAL_EVIDENCE_POLICY: ${EXTERNAL_EVIDENCE_POLICY:-deny}
      EXTERNAL_ALLOWED_CLASSIFICATIONS: ${EXTERNAL_ALLOWED_CLASSIFICATIONS:-public}
      ALLOW_SENSITIVE_EXTERNAL_DATA: ${ALLOW_SENSITIVE_EXTERNAL_DATA:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      SEARXNG_API_KEY: ${SEARXNG_API_KEY:-}
      MODEL_PRICING_MODEL: ${MODEL_PRICING_MODEL:-}
      MODEL_INPUT_PRICE_PER_MILLION: ${MODEL_INPUT_PRICE_PER_MILLION:-}
      MODEL_OUTPUT_PRICE_PER_MILLION: ${MODEL_OUTPUT_PRICE_PER_MILLION:-}
      SEARCH_PRICE_PER_REQUEST_USD: ${SEARCH_PRICE_PER_REQUEST_USD:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_PRICE_PER_MILLION: ${EMBEDDING_PRICE_PER_MILLION:-}
      EMBEDDING_MAX_BATCH_USD: ${EMBEDDING_MAX_BATCH_USD:-}
      ISOLATED_RENDERER_URL: ${ISOLATED_RENDERER_URL:-}
      ISOLATED_RENDERER_API_KEY: ${ISOLATED_RENDERER_API_KEY:-}
      ISOLATED_RENDERER_EGRESS_ATTESTED: ${ISOLATED_RENDERER_EGRESS_ATTESTED:-false}
      ENABLE_PGVECTOR: 'true'
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: *backend-env
    volumes: [objects:/data/objects]
    ports: [127.0.0.1:8000:8000]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: *backend-env
    command: [python, -m, backend.worker]
    volumes: [objects:/data/objects]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
  dispatcher:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: *backend-env
    command: [python, -m, backend.dispatcher]
    volumes: [objects:/data/objects]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      SINGLE_USER_MODE: 'false'
    ports: [127.0.0.1:3000:3000]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  objects:
